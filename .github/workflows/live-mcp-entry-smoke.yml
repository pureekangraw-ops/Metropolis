name: live-mcp-entry-smoke

on:
  push:
    branches:
      - smoke/live-mcp-entry-20261006

jobs:
  live-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Metropolis entry
        shell: bash
        run: |
          set -u
          BASE="https://metropolis.pureekangraw.workers.dev"

          probe_get() {
            name="$1"; url="$2"
            echo "== $name =="
            curl -sS -D "$name.headers" -o "$name.json" -w 'HTTP=%{http_code}\n' "$url" || true
            cat "$name.headers"
            cat "$name.json"; echo
          }

          probe_get health "$BASE/health"
          probe_get resource "$BASE/.well-known/oauth-protected-resource"
          probe_get oauth "$BASE/.well-known/oauth-authorization-server"

          echo "== mcp unauthenticated initialize =="
          curl -sS -D mcp.headers -o mcp.json -w 'HTTP=%{http_code}\n' \
            -X POST "$BASE/mcp" \
            -H 'Origin: https://chatgpt.com' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"live-smoke","version":"2"}}}' || true
          cat mcp.headers
          cat mcp.json; echo

          echo "LIVE_PROBE_COMPLETE"
