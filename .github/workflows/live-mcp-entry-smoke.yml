name: live-mcp-entry-smoke

on:
  push:
    branches:
      - smoke/live-mcp-entry-20261006

jobs:
  live-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live ChatGPT OAuth path
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://metropolis.pureekangraw.workers.dev"
          EXPECTED_SHA="12b9e64763eae5106a18ab25985e1db647e8a958"
          CLIENT_ID="https://chatgpt.com/oauth/client.json"
          REDIRECT="https://chatgpt.com/connector_platform_oauth_redirect"
          CHALLENGE="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

          echo "== health =="
          curl -fsS "$BASE/health" -o health.json
          jq -e --arg sha "$EXPECTED_SHA" '.status=="READY" and .sourceSha==$sha' health.json

          echo "== ChatGPT CIMD document =="
          curl -fsS "$CLIENT_ID" -o client.json
          cat client.json
          jq -e --arg cid "$CLIENT_ID" --arg redirect "$REDIRECT" '
            .client_id==$cid and
            (.redirect_uris | index($redirect) != null) and
            (.token_endpoint_auth_methods_supported | index("none") != null) and
            (.grant_types | index("authorization_code") != null) and
            (.response_types | index("code") != null)
          ' client.json

          echo "== Metropolis authorize with real ChatGPT CIMD =="
          code=$(curl -sS -G -o authorize.html -D authorize.headers -w '%{http_code}' \
            "$BASE/oauth/authorize" \
            --data-urlencode 'response_type=code' \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "redirect_uri=$REDIRECT" \
            --data-urlencode "code_challenge=$CHALLENGE" \
            --data-urlencode 'code_challenge_method=S256' \
            --data-urlencode 'scope=metropolis-go' \
            --data-urlencode "resource=$BASE/mcp" \
            --data-urlencode 'state=live-chatgpt-smoke')
          cat authorize.headers
          head -c 1200 authorize.html; echo
          test "$code" = "200"
          grep -q '<title>Metropolis authorization</title>' authorize.html
          grep -q 'name="passcode"' authorize.html
          grep -q 'name="actor"' authorize.html
          grep -q 'value="https://chatgpt.com/oauth/client.json"' authorize.html
          grep -q 'value="https://chatgpt.com/connector_platform_oauth_redirect"' authorize.html

          echo "CHATGPT_AUTHORIZE_SMOKE=PASS"
