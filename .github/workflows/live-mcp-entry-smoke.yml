name: live-mcp-entry-smoke

on:
  push:
    branches:
      - smoke/live-mcp-entry-20261006

jobs:
  live-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Metropolis entry
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://metropolis.pureekangraw.workers.dev"
          EXPECTED_SHA="7466d3c1c110ee86a358e2e23d0d0ed2194ec3d7"

          echo "== health =="
          curl -fsS "$BASE/health" -o health.json
          cat health.json
          jq -e --arg sha "$EXPECTED_SHA" '.status=="READY" and .sourceSha==$sha' health.json

          echo "== unauthenticated MCP entry =="
          code=$(curl -sS -o mcp.json -D mcp.headers -w '%{http_code}' \
            -X POST "$BASE/mcp" \
            -H 'Origin: https://chatgpt.com' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"live-smoke","version":"1"}}}')
          cat mcp.headers
          cat mcp.json
          test "$code" = "401"
          grep -qi '^www-authenticate: Bearer resource_metadata="https://metropolis.pureekangraw.workers.dev/.well-known/oauth-protected-resource"' mcp.headers

          echo "== protected resource metadata =="
          curl -fsS "$BASE/.well-known/oauth-protected-resource" -o resource.json
          cat resource.json
          jq -e --arg base "$BASE" '.resource==($base+"/mcp") and (.authorization_servers | index($base) != null)' resource.json

          echo "== authorization server metadata =="
          curl -fsS "$BASE/.well-known/oauth-authorization-server" -o oauth.json
          cat oauth.json
          jq -e --arg base "$BASE" '
            .issuer==$base and
            .authorization_endpoint==($base+"/oauth/authorize") and
            .token_endpoint==($base+"/oauth/token") and
            (.code_challenge_methods_supported | index("S256") != null) and
            (.grant_types_supported | index("authorization_code") != null)
          ' oauth.json

          echo "LIVE_ENTRY_SMOKE=PASS"
