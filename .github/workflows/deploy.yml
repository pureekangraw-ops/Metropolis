name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metropolis-production
  cancel-in-progress: false
jobs:
  deploy:
    # BIG ordered GitHub deployment disconnected; retain job for reversible restoration.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: npm test
      - name: Install pinned Wrangler without dirtying source tree
        run: |
          npm install --no-save --package-lock=false wrangler@4.147.0
          npx --no-install wrangler --version
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Deploy existing Metropolis Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.147.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Configure Notion credential from repository secret when supplied
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$NOTION_TOKEN" ]; then
            printf '%s' "$NOTION_TOKEN" | npx --no-install wrangler secret put NOTION_TOKEN
          else
            echo 'Repository NOTION_TOKEN absent; existing Worker secret preserved.'
          fi
